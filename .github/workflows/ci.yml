name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.26.x'
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...
      - name: Race check compact readers
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/atlas ./internal/columns ./internal/compactgeom ./internal/keyindex ./internal/spatialindex ./internal/regionatlas ./offline
